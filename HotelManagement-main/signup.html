<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Grand Hotel</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="container">
        <div class="logo">
          <a href="index.html">
            <i class="fas fa-hotel"></i>
            <span>Grand Hotel</span>
          </a>
        </div>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="rooms.html">Rooms</a></li>
          <li><a href="booking.html">Booking</a></li>
        </ul>
      </div>
    </nav>

    <!-- Sign Up Section -->
    <section class="auth-section">
      <div class="auth-container">
        <div class="auth-image">
          <img
            src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?w=800&h=600&fit=crop"
            alt="Hotel Luxury"
          />
          <div class="auth-overlay">
            <h2>Join Us Today!</h2>
            <p>
              Create an account and enjoy exclusive benefits and seamless
              booking
            </p>
          </div>
        </div>
        <div class="auth-form-container">
          <div class="auth-form-wrapper">
            <h2>Create Your Account</h2>
            <p class="auth-subtitle">Fill in your details to get started</p>

            <div class="alert" id="signupAlert" style="display: none"></div>

            <form id="signupForm" class="auth-form">
              <div class="form-row">
                <div class="form-group">
                  <label for="firstName">
                    <i class="fas fa-user"></i> First Name
                  </label>
                  <input
                    type="text"
                    id="firstName"
                    name="firstName"
                    placeholder="First name"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="lastName">
                    <i class="fas fa-user"></i> Last Name
                  </label>
                  <input
                    type="text"
                    id="lastName"
                    name="lastName"
                    placeholder="Last name"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="email">
                  <i class="fas fa-envelope"></i> Email Address
                </label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="phone">
                  <i class="fas fa-phone"></i> Phone Number
                </label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                  required
                />
              </div>

              <div class="form-group">
                <label for="password">
                  <i class="fas fa-lock"></i> Password
                </label>
                <div class="password-input">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                    minlength="6"
                  />
                  <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
                <small class="form-help"
                  >Password must be at least 6 characters</small
                >
              </div>

              <div class="form-group">
                <label for="confirmPassword">
                  <i class="fas fa-lock"></i> Confirm Password
                </label>
                <div class="password-input">
                  <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                  />
                  <button
                    type="button"
                    class="toggle-password"
                    id="toggleConfirmPassword"
                  >
                    <i class="fas fa-eye"></i>
                  </button>
                </div>
              </div>

              <div class="form-options">
                <label class="checkbox-label">
                  <input type="checkbox" id="terms" required />
                  <span>I agree to the <a href="#">Terms & Conditions</a></span>
                </label>
              </div>

              <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-user-plus"></i> Sign Up
              </button>
              <br />

              <p class="auth-switch">
                Already have an account? <a href="login.html">Login</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script src="js/auth.js"></script>
  </body>
</html>
