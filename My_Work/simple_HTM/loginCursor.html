<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="loginCursor.css" />
  </head>
  <body>
    <div class="container">
      <div class="form-card">
        <div class="logo"></div>
        <h1>Sign in</h1>

        <form>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Your email address" />
          <button type="submit" class="primary-btn">Continue</button>
        </form>

        <div class="divider">
          <span class="or-text">OR</span>
        </div>

        <div class="social-logins">
          <button class="social-btn google">Continue with Google</button>
          <button class="social-btn github">Continue with GitHub</button>
          <button class="social-btn apple">Continue with Apple</button>
        </div>

        <p class="signup-link">
          Don't have an account? <a href="#">Sign up</a>
        </p>
      </div>
    </div>
  </body>
</html>
