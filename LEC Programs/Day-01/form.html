<!DOCTYPE html>
<html>
    <head>
        <title>My Form Page</title>
    </head>
    <form action="https://www.google.com">
        <div>
            <label>Name:</label>
            <input type="text" placeholder="Enter Name">
        </div>
        <br>
        <div>
            <label>Password:</label>
            <input type="password" placeholder="Enter Password">
        </div>
        <br>
        <div>
            <label>Numeric value:</label>
            <input type="number" placeholder="Enter numeric value">
        </div>
        <br>
        <div>
            <label>Dob:</label>
            <input type="date">
        </div>
        <br>
        <div>
            <label>Qualification:</label>
            <select>
                <option value="101">B.Tech</option>
                <option value="102">M.Tech</option>
                <option value="103">BSC</option>
                <option value="104">MSC</option>
            </select>
        </div>
        <br>
        <div>
            <label>Gender:</label>
            <input type="radio" name="gender"> <label>Male</label> 
            <input type="radio" name="gender"> <label>Female</label>
        </div>
        <br>
        <div>
            <label>Address:</label>
            <textarea placeholder="Enter Address"></textarea>
        </div>
        <br>
        <div>
            <label>Upload File:</label>
            <input type="file">
        </div>
        <br>
        <div>
            <label>Time:</label>
            <input type="time">
        </div>
        <br>
        <div>
            <input type="checkbox"> <label> I Accept terms and conditions</label>
        </div>
        <br>
        <div>
            <input type="button" value="Click">
            <button type="button">Click me</button>
            <input type="submit" value="Sign Up">
            <button type="submit">Register</button>
            <button type="reset">Clear form data</button>
        </div>
    </form>
</body>
